<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Life OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f2f2f7; color: #0f172a; }
    .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 2rem; box-shadow: 0 24px 70px rgba(15,23,42,.08); }
    .field { width: 100%; background: #f8fafc; border: 1px solid #dbe3ef; border-radius: 1rem; padding: .9rem 1rem; outline: none; }
    .field:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.14); }
    .btn { border-radius: 1rem; padding: .9rem 1rem; font-weight: 800; background: #4f46e5; color: #fff; width: 100%; }
  </style>
</head>
<body>
  <main class="min-h-screen flex items-center justify-center p-6">
    <form class="panel p-8 w-full max-w-md" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg">
          <div class="w-5 h-5 border-2 border-white rounded-md"></div>
        </div>
        <div>
          <p class="text-xs uppercase tracking-widest text-gray-500">Acesso privado</p>
          <h1 class="text-2xl font-extrabold tracking-tight">LIFE OS</h1>
        </div>
      </div>
      <p class="text-gray-500 mb-5">Entre para acessar dados financeiros, inbox e automacoes.</p>
      {% if error %}
      <div class="bg-red-50 text-red-700 border border-red-100 rounded-2xl p-3 text-sm mb-4">{{ error }}</div>
      {% endif %}
      <label class="text-sm font-bold text-gray-600" for="password">Senha</label>
      <input class="field mt-2 mb-5" id="password" name="password" type="password" autocomplete="current-password" autofocus>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
