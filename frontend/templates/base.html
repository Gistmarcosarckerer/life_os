<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .panel { background: rgba(17, 24, 39, 0.82); border: 1px solid rgba(75, 85, 99, 0.55); border-radius: 8px; }
    .panel-soft { background: rgba(31, 41, 55, 0.62); border: 1px solid rgba(75, 85, 99, 0.45); border-radius: 8px; }
    .muted { color: #9ca3af; }
    .field { width: 100%; background: #030712; border: 1px solid #374151; border-radius: 8px; padding: 0.7rem 0.8rem; color: #f9fafb; }
    .btn { border-radius: 8px; padding: 0.7rem 0.9rem; font-weight: 700; }
    .btn-primary { background: #f9fafb; color: #030712; }
    .btn-secondary { background: #1f2937; color: #f9fafb; border: 1px solid #374151; }
    .badge { border-radius: 999px; padding: 0.25rem 0.55rem; font-size: 0.75rem; font-weight: 700; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100">
  <div class="min-h-screen lg:flex">
    <aside class="lg:w-64 border-r border-gray-800 bg-gray-950 lg:fixed lg:inset-y-0">
      <div class="p-5 border-b border-gray-800">
        <p class="text-xs uppercase tracking-widest text-gray-500">Personal OS</p>
        <h1 class="text-2xl font-extrabold mt-1">LIFE OS</h1>
      </div>
      <nav class="p-3 grid gap-1 text-sm">
        <a class="px-3 py-2 rounded hover:bg-gray-900 {% if request.path == '/' %}bg-gray-900 text-white{% else %}text-gray-400{% endif %}" href="/">Dashboard</a>
        <a class="px-3 py-2 rounded hover:bg-gray-900 {% if request.path.startswith('/finance') %}bg-gray-900 text-white{% else %}text-gray-400{% endif %}" href="/finance">Financeiro</a>
        <a class="px-3 py-2 rounded hover:bg-gray-900 {% if request.path == '/productivity' %}bg-gray-900 text-white{% else %}text-gray-400{% endif %}" href="/productivity">Produtividade</a>
        <a class="px-3 py-2 rounded hover:bg-gray-900 {% if request.path == '/gym' %}bg-gray-900 text-white{% else %}text-gray-400{% endif %}" href="/gym">Gym</a>
        <a class="px-3 py-2 rounded hover:bg-gray-900 {% if request.path == '/telegram' %}bg-gray-900 text-white{% else %}text-gray-400{% endif %}" href="/telegram">Telegram</a>
        <a class="px-3 py-2 rounded hover:bg-gray-900 {% if request.path == '/settings' %}bg-gray-900 text-white{% else %}text-gray-400{% endif %}" href="/settings">Configuracoes</a>
      </nav>
    </aside>

    <main class="flex-1 lg:ml-64">
      <header class="sticky top-0 z-10 bg-gray-950 bg-opacity-90 border-b border-gray-800 backdrop-filter backdrop-blur">
        <div class="px-5 md:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-2">
          <div>
            <p class="text-xs uppercase tracking-widest text-gray-500">{% block eyebrow %}Sistema de decisao{% endblock %}</p>
            <h2 class="text-xl md:text-2xl font-bold">{% block title %}Dashboard{% endblock %}</h2>
          </div>
          <p class="text-sm text-gray-500">Atualizacao inteligente em tempo real</p>
        </div>
      </header>
      <div class="px-5 md:px-8 py-6">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
