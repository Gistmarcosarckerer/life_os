<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Life OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --surface: rgba(255, 255, 255, 0.055);
      --surface-strong: rgba(255, 255, 255, 0.085);
      --line: rgba(255, 255, 255, 0.09);
      --text: #f8fafc;
      --muted: #94a3b8;
      --violet: #8b5cf6;
      --cyan: #22d3ee;
      --emerald: #34d399;
      --rose: #fb7185;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 0%, rgba(139, 92, 246, 0.18), transparent 28rem),
        radial-gradient(circle at 95% 18%, rgba(34, 211, 238, 0.08), transparent 24rem),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: inherit; }
    .app-shell {
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0));
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1.75rem;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
    }
    .panel-soft {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 1.25rem;
    }
    .glass {
      background: rgba(10, 10, 12, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.075);
      backdrop-filter: blur(22px);
    }
    .muted { color: var(--muted); }
    .field {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 1.1rem;
      padding: 0.85rem 1rem;
      color: var(--text);
      outline: none;
    }
    .field::placeholder { color: #64748b; }
    .field:focus {
      border-color: rgba(139, 92, 246, 0.8);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
    }
    .btn {
      border-radius: 1rem;
      padding: 0.82rem 1rem;
      font-weight: 800;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      color: #fff;
      box-shadow: 0 16px 40px rgba(124, 58, 237, 0.28);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.11);
    }
    .badge {
      border-radius: 999px;
      padding: 0.34rem 0.72rem;
      font-size: 0.72rem;
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.82rem 0.9rem;
      border-radius: 1rem;
      color: #94a3b8;
      font-weight: 750;
      transition: background 160ms ease, color 160ms ease;
    }
    .nav-item:hover { background: rgba(255, 255, 255, 0.055); color: #fff; }
    .nav-active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.26), rgba(34, 211, 238, 0.09));
      color: #fff;
      border: 1px solid rgba(139, 92, 246, 0.32);
    }
    .nav-icon {
      width: 2.05rem;
      height: 2.05rem;
      border-radius: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.07);
      color: #c4b5fd;
      font-size: 0.78rem;
      font-weight: 900;
    }
    .metric-card {
      min-height: 11.5rem;
      border-radius: 1.6rem;
      padding: 1.35rem;
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .metric-card::after {
      content: "";
      position: absolute;
      inset: auto -2.5rem -2.5rem auto;
      width: 8rem;
      height: 8rem;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.13);
      filter: blur(12px);
    }
    .metric-indigo { background: linear-gradient(145deg, rgba(124, 58, 237, 0.28), rgba(255, 255, 255, 0.045)); }
    .metric-orange { background: linear-gradient(145deg, rgba(251, 191, 36, 0.18), rgba(255, 255, 255, 0.045)); }
    .metric-white { background: linear-gradient(145deg, rgba(34, 211, 238, 0.12), rgba(255, 255, 255, 0.045)); }
    .metric-dark { background: linear-gradient(145deg, rgba(52, 211, 153, 0.13), rgba(255, 255, 255, 0.045)); }
    .text-gray-300, .text-gray-400, .text-gray-500 { color: var(--muted) !important; }
    .text-green-300 { color: #86efac !important; }
    .text-red-300 { color: #fda4af !important; }
    .bg-gray-800, .bg-gray-900 { background: rgba(255, 255, 255, 0.08) !important; color: #cbd5e1 !important; }
    .bg-green-400 { background: rgba(52, 211, 153, 0.16) !important; color: #bbf7d0 !important; }
    .bg-white { background: rgba(255, 255, 255, 0.08) !important; }
    .text-slate-600, .text-slate-700, .text-slate-800, .text-slate-900 { color: #e2e8f0 !important; }
    .border-slate-100, .border-slate-200, .border-gray-200 { border-color: rgba(255, 255, 255, 0.08) !important; }
    .shadow-sm, .shadow-lg { box-shadow: none !important; }
    .profile-photo {
      background-image: url("{{ url_for('static', filename='images/profile-beach-gym.jpeg') }}");
      background-size: cover;
      background-position: center 28%;
    }
  </style>
</head>
<body>
  <div class="app-shell lg:flex">
    <aside class="lg:w-72 lg:fixed lg:inset-y-0 p-4 md:p-6">
      <div class="glass rounded-3xl p-4 lg:min-h-full">
        <div class="flex items-center gap-3 mb-8">
          <div class="w-12 h-12 rounded-2xl profile-photo border border-white border-opacity-20"></div>
          <div>
            <p class="text-xs uppercase tracking-widest text-gray-500">Personal OS</p>
            <h1 class="text-2xl font-black tracking-tight">LIFE OS</h1>
          </div>
        </div>

        <nav class="grid gap-2 text-sm">
          <a class="nav-item {% if request.path == '/' %}nav-active{% endif %}" href="/"><span class="nav-icon">D</span>Dashboard</a>
          <a class="nav-item {% if request.path == '/inbox' %}nav-active{% endif %}" href="/inbox"><span class="nav-icon">I</span>Inbox</a>
          <a class="nav-item {% if request.path.startswith('/finance') %}nav-active{% endif %}" href="/finance"><span class="nav-icon">F</span>Financas</a>
          <a class="nav-item {% if request.path == '/productivity' %}nav-active{% endif %}" href="/productivity"><span class="nav-icon">P</span>Produtividade</a>
          <a class="nav-item {% if request.path == '/gym' %}nav-active{% endif %}" href="/gym"><span class="nav-icon">G</span>Treino</a>
          <a class="nav-item {% if request.path == '/telegram' %}nav-active{% endif %}" href="/telegram"><span class="nav-icon">T</span>Telegram</a>
          <a class="nav-item {% if request.path == '/settings' %}nav-active{% endif %}" href="/settings"><span class="nav-icon">S</span>Config</a>
          <a class="nav-item" href="/logout"><span class="nav-icon">X</span>Sair</a>
        </nav>

        <div class="hidden lg:block mt-8 panel-soft p-5">
          <p class="text-xs font-extrabold text-gray-500 uppercase tracking-widest mb-3">Sistema</p>
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-bold text-gray-300">Cloud</span>
            <span class="badge">online</span>
          </div>
          <div class="w-full h-2 rounded-full overflow-hidden" style="background: rgba(255,255,255,.08);">
            <div class="h-full rounded-full" style="width: 98%; background: linear-gradient(90deg, #7c3aed, #22d3ee);"></div>
          </div>
        </div>
      </div>
    </aside>

    <main class="flex-1 lg:ml-72">
      <header class="sticky top-0 z-10" style="background: rgba(5, 5, 5, 0.72); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(255,255,255,.06);">
        <div class="px-5 md:px-10 py-5 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
          <div>
            <p class="text-sm text-gray-500 font-semibold mb-1">{% block eyebrow %}Sistema de decisao{% endblock %}</p>
            <h2 class="text-3xl md:text-4xl font-black tracking-tight">{% block title %}Dashboard{% endblock %}</h2>
          </div>
          <div class="flex items-center gap-3">
            <div class="panel-soft px-4 py-2 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full" style="background: var(--emerald); box-shadow: 0 0 18px rgba(52,211,153,.8);"></span>
              <span class="text-sm font-bold text-gray-300">Sistema conectado</span>
            </div>
            <div class="w-11 h-11 rounded-full profile-photo border border-white border-opacity-20"></div>
          </div>
        </div>
      </header>
      <div class="px-5 md:px-10 pb-10 pt-6">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
