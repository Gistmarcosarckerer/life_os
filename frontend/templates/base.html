<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    :root {
      --app-bg: #f2f2f7;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --indigo: #4f46e5;
      --orange: #f97316;
      --emerald: #10b981;
    }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--app-bg);
      color: var(--text);
    }
    .panel {
      background: var(--surface);
      border: 1px solid rgba(226, 232, 240, 0.95);
      border-radius: 2rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.055);
    }
    .panel-soft {
      background: var(--surface-soft);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 1.35rem;
    }
    .metric-card {
      min-height: 12rem;
      border-radius: 2rem;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 24px 52px rgba(15, 23, 42, 0.08);
    }
    .metric-card::after {
      content: "";
      position: absolute;
      width: 9rem;
      height: 9rem;
      right: -4rem;
      top: -4rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      filter: blur(18px);
    }
    .metric-orange { background: var(--orange); color: #fff; }
    .metric-indigo { background: var(--indigo); color: #fff; }
    .metric-white { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .metric-dark { background: #111827; color: #fff; }
    .metric-icon {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.22);
      font-weight: 800;
    }
    .metric-white .metric-icon { background: #eef2ff; color: var(--indigo); }
    .muted { color: var(--muted); }
    .field {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #dbe3ef;
      border-radius: 1rem;
      padding: 0.78rem 0.9rem;
      color: var(--text);
      outline: none;
    }
    .field:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14); }
    .btn { border-radius: 1rem; padding: 0.78rem 0.95rem; font-weight: 800; }
    .btn-primary { background: var(--indigo); color: #fff; box-shadow: 0 12px 24px rgba(79, 70, 229, 0.22); }
    .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .badge { border-radius: 999px; padding: 0.28rem 0.65rem; font-size: 0.75rem; font-weight: 800; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-radius: 1rem;
      color: #64748b;
      font-weight: 700;
      transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }
    .nav-item:hover { background: rgba(226, 232, 240, 0.7); color: var(--text); }
    .nav-active { background: #fff; color: var(--indigo); box-shadow: 0 12px 28px rgba(15, 23, 42, 0.07); }
    .nav-icon {
      width: 2rem;
      height: 2rem;
      border-radius: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2ff;
      color: var(--indigo);
      font-size: 0.8rem;
      font-weight: 900;
    }
    .text-gray-300, .text-gray-400, .text-gray-500 { color: var(--muted) !important; }
    .metric-dark .text-gray-300, .metric-dark .text-gray-400, .metric-dark .text-gray-500 { color: rgba(255, 255, 255, 0.72) !important; }
    .text-green-300 { color: #059669 !important; }
    .text-red-300 { color: #dc2626 !important; }
    .bg-gray-800, .bg-gray-900 { background: #eef2ff !important; color: var(--indigo) !important; }
    .bg-green-400 { background: #d1fae5 !important; color: #065f46 !important; }
  </style>
</head>
<body>
  <div class="min-h-screen lg:flex">
    <aside class="lg:w-72 bg-transparent lg:fixed lg:inset-y-0 p-4 md:p-6">
      <div class="flex items-center gap-3 mb-8 px-2">
        <div class="w-11 h-11 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg" style="box-shadow: 0 16px 34px rgba(79,70,229,.28);">
          <div class="w-5 h-5 border-2 border-white rounded-md"></div>
        </div>
        <div>
          <p class="text-xs uppercase tracking-widest text-gray-500">Personal OS</p>
          <h1 class="text-2xl font-extrabold tracking-tight">LIFE OS</h1>
        </div>
      </div>
      <nav class="grid gap-2 text-sm">
        <a class="nav-item {% if request.path == '/' %}nav-active{% endif %}" href="/"><span class="nav-icon">D</span>Dashboard</a>
        <a class="nav-item {% if request.path.startswith('/finance') %}nav-active{% endif %}" href="/finance"><span class="nav-icon">F</span>Financeiro</a>
        <a class="nav-item {% if request.path == '/productivity' %}nav-active{% endif %}" href="/productivity"><span class="nav-icon">P</span>Produtividade</a>
        <a class="nav-item {% if request.path == '/gym' %}nav-active{% endif %}" href="/gym"><span class="nav-icon">G</span>Gym</a>
        <a class="nav-item {% if request.path == '/telegram' %}nav-active{% endif %}" href="/telegram"><span class="nav-icon">T</span>Telegram</a>
        <a class="nav-item {% if request.path == '/settings' %}nav-active{% endif %}" href="/settings"><span class="nav-icon">S</span>Configuracoes</a>
      </nav>
      <div class="hidden lg:block mt-8 p-5 rounded-3xl border border-indigo-100 bg-indigo-50">
        <p class="text-xs font-extrabold text-indigo-400 uppercase tracking-widest mb-2">System Health</p>
        <div class="flex items-end gap-2 mb-2">
          <span class="text-3xl font-extrabold text-indigo-900">98%</span>
          <span class="text-xs text-indigo-500 mb-1 font-bold">Operational</span>
        </div>
        <div class="w-full h-2 bg-indigo-200 rounded-full overflow-hidden">
          <div class="h-full bg-indigo-600 rounded-full" style="width: 98%;"></div>
        </div>
      </div>
    </aside>

    <main class="flex-1 lg:ml-72">
      <header class="sticky top-0 z-10 bg-opacity-80 backdrop-filter backdrop-blur" style="background: rgba(242,242,247,.84);">
        <div class="px-5 md:px-10 py-6 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
          <div>
            <p class="text-sm text-gray-500 font-semibold mb-1">{% block eyebrow %}Sistema de decisao{% endblock %}</p>
            <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight">{% block title %}Dashboard{% endblock %}</h2>
          </div>
          <div class="flex items-center gap-3">
            <div class="bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-2">
              <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
              <span class="text-sm font-bold text-slate-600">Atualizacao em tempo real</span>
            </div>
            <div class="w-12 h-12 rounded-full overflow-hidden ring-4 ring-white bg-gradient-to-tr from-indigo-500 to-purple-500"></div>
          </div>
        </div>
      </header>
      <div class="px-5 md:px-10 pb-10 pt-2">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
